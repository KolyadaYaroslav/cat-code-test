version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vetgenetika-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      JWT_SECRET: dev-secret-key-super-secure
      DATABASE_URL: sqlite:./database.db
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/database.db:/app/database.db
    command: npm run dev
    networks:
      - vetgenetika

  # Опционально: PostgreSQL для продакшена
  postgres:
    image: postgres:15-alpine
    container_name: vetgenetika-db
    environment:
      POSTGRES_DB: vetgenetika
      POSTGRES_USER: vetuser
      POSTGRES_PASSWORD: vetpass123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vetgenetika
    profiles:
      - postgres

  frontend:
    image: nginx:alpine
    container_name: vetgenetika-frontend
    ports:
      - "8000:80"
    volumes:
      - ./catcode-prod-test:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - vetgenetika

networks:
  vetgenetika:
    driver: bridge

volumes:
  postgres_data:
